[package]
name = "netqmon-classifier-manager"
description = "Downloads, verifies, and supervises the NetQMon classifier component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22.1"
ed25519-dalek = "2.2.0"
hex = "0.4.3"
netqmon-classifier-client = { path = "../classifier-client" }
nix = { version = "0.31.3", features = ["process", "signal"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["macros", "process", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
