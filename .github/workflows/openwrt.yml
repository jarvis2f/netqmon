name: OpenWrt Packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish packages to
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: openwrt-packages-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  detect-changes:
    name: Check agent and OpenWrt package changes
    runs-on: ubuntu-latest
    outputs:
      build: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') && 'true' || steps.changes.outputs.build }}
    steps:
      - name: Check out repository and release history
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Validate requested release tag
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        run: git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"

      - name: Detect relevant changes since the previous release in this channel
        id: changes
        run: python3 scripts/release/detect_openwrt_changes.py

  # 1. Official Release Blocking Native Agent Builds
  build-agent-binaries:
    name: Build Agent Binary (${{ matrix.arch }}) [Official]
    needs: detect-changes
    if: needs.detect-changes.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: bash
        run: |
          set -euo pipefail
          cargo_version="$(awk -F'"' '/^\[workspace.package\]/{in_workspace=1; next} in_workspace && /^version = /{print $2; exit}' Cargo.toml)"
          release_version="${RELEASE_TAG#v}"
          test "${cargo_version}" = "${release_version}" \
            || { echo "Cargo workspace version ${cargo_version} does not match tag ${release_version}" >&2; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build agent binary via Docker
        run: |
          docker build \
            --target builder \
            -f deploy/docker/Dockerfile.agent \
            -t netqmon-agent-builder:${{ matrix.arch }} \
            .
          mkdir -p dist
          id=$(docker create netqmon-agent-builder:${{ matrix.arch }})
          docker cp "$id:/netqmon-agent" "dist/netqmon-agent_${{ matrix.arch }}"
          docker rm "$id"
          chmod 0755 "dist/netqmon-agent_${{ matrix.arch }}"
          file "dist/netqmon-agent_${{ matrix.arch }}"

      - name: Smoke test agent version
        shell: bash
        run: |
          set -euo pipefail
          expected="$(awk -F'"' '/^\[workspace.package\]/{in_workspace=1; next} in_workspace && /^version = /{print $2; exit}' Cargo.toml)"
          test "$("dist/netqmon-agent_${{ matrix.arch }}" --version)" = "netqmon-agent ${expected}"

      - name: Upload agent binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-binaries-${{ matrix.arch }}
          path: dist/netqmon-agent_${{ matrix.arch }}

  # 2. Official Cross-Compilation for armv7hf (Release Blocking)
  build-agent-armv7hf:
    name: Build Agent Binary (armv7hf) [Official]
    needs: detect-changes
    if: needs.detect-changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: bash
        run: |
          set -euo pipefail
          cargo_version="$(awk -F'"' '/^\[workspace.package\]/{in_workspace=1; next} in_workspace && /^version = /{print $2; exit}' Cargo.toml)"
          release_version="${RELEASE_TAG#v}"
          test "${cargo_version}" = "${release_version}" \
            || { echo "Cargo workspace version ${cargo_version} does not match tag ${release_version}" >&2; exit 1; }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build with cross
        run: |
          cross build --release --package netqmon-agent --target armv7-unknown-linux-musleabihf
          mkdir -p dist
          cp target/armv7-unknown-linux-musleabihf/release/netqmon-agent dist/netqmon-agent_armv7hf
          chmod 0755 dist/netqmon-agent_armv7hf

      - name: Smoke test binary metadata
        run: |
          file dist/netqmon-agent_armv7hf
          readelf -h dist/netqmon-agent_armv7hf
          readelf -d dist/netqmon-agent_armv7hf || true

      - name: Smoke test execution via QEMU user
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-user
          expected="$(awk -F'"' '/^\[workspace.package\]/{in_workspace=1; next} in_workspace && /^version = /{print $2; exit}' Cargo.toml)"
          test "$(qemu-arm dist/netqmon-agent_armv7hf --version)" = "netqmon-agent ${expected}"

      - name: Upload agent binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-binaries-armv7hf
          path: dist/netqmon-agent_armv7hf

  # 3. Candidate Official Cross-Compilation for RISC-V64 (Non-blocking)
  build-agent-riscv64:
    name: Build Agent Binary (riscv64) [Candidate Official]
    needs: detect-changes
    if: needs.detect-changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: bash
        run: |
          set -euo pipefail
          cargo_version="$(awk -F'"' '/^\[workspace.package\]/{in_workspace=1; next} in_workspace && /^version = /{print $2; exit}' Cargo.toml)"
          release_version="${RELEASE_TAG#v}"
          test "${cargo_version}" = "${release_version}" \
            || { echo "Cargo workspace version ${cargo_version} does not match tag ${release_version}" >&2; exit 1; }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64gc-unknown-linux-musl

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build with cross
        run: |
          RUSTFLAGS="-C target-feature=+crt-static" cross build --release --package netqmon-agent --target riscv64gc-unknown-linux-musl
          mkdir -p dist
          cp target/riscv64gc-unknown-linux-musl/release/netqmon-agent dist/netqmon-agent_riscv64
          chmod 0755 dist/netqmon-agent_riscv64

      - name: Verify riscv64 artifact
        run: |
          file dist/netqmon-agent_riscv64
          readelf -h dist/netqmon-agent_riscv64
          readelf -d dist/netqmon-agent_riscv64 || true

          # Check static linkage and architecture
          file dist/netqmon-agent_riscv64 | grep -q "statically linked"
          readelf -h dist/netqmon-agent_riscv64 | grep -q "RISC-V"

          # Smoke test execution via QEMU user
          sudo apt-get update && sudo apt-get install -y qemu-user
          expected="$(awk -F'"' '/^\[workspace.package\]/{in_workspace=1; next} in_workspace && /^version = /{print $2; exit}' Cargo.toml)"
          test "$(qemu-riscv64 dist/netqmon-agent_riscv64 --version)" = "netqmon-agent ${expected}"

      - name: Upload agent binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-binaries-riscv64
          path: dist/netqmon-agent_riscv64

  # 3b. Experimental: MIPSEL (MIPS32r2 little-endian, soft-float)
  build-agent-mipsel:
    name: Build Agent [mipsel-unknown-linux-musl] (Experimental)
    needs: detect-changes
    if: needs.detect-changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: bash
        run: |
          set -euo pipefail
          cargo_version="$(awk -F'"' '/^\[workspace.package\]/{in_workspace=1; next} in_workspace && /^version = /{print $2; exit}' Cargo.toml)"
          release_version="${RELEASE_TAG#v}"
          test "${cargo_version}" = "${release_version}" \
            || { echo "Cargo workspace version ${cargo_version} does not match tag ${release_version}" >&2; exit 1; }

      - name: Install Rust nightly toolchain (required for Tier 3 build-std)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build with cross
        run: |
          RUSTFLAGS="-C target-feature=+crt-static" cross build --release --package netqmon-agent --target mipsel-unknown-linux-musl
          mkdir -p dist
          cp target/mipsel-unknown-linux-musl/release/netqmon-agent dist/netqmon-agent_mipsel32r2
          chmod 0755 dist/netqmon-agent_mipsel32r2

      - name: Verify mipsel artifact
        run: |
          file dist/netqmon-agent_mipsel32r2
          readelf -h dist/netqmon-agent_mipsel32r2
          readelf -A dist/netqmon-agent_mipsel32r2
          readelf -d dist/netqmon-agent_mipsel32r2 || true

          # Check static linkage and architecture
          file dist/netqmon-agent_mipsel32r2 | grep -q "statically linked"
          readelf -h dist/netqmon-agent_mipsel32r2 | grep -q "MIPS"
          readelf -A dist/netqmon-agent_mipsel32r2 | grep -i "soft float"

          # Smoke test execution via QEMU user
          sudo apt-get update && sudo apt-get install -y qemu-user
          expected="$(awk -F'"' '/^\[workspace.package\]/{in_workspace=1; next} in_workspace && /^version = /{print $2; exit}' Cargo.toml)"
          test "$(qemu-mipsel dist/netqmon-agent_mipsel32r2 --version)" = "netqmon-agent ${expected}"

      - name: Upload agent binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-binaries-mipsel32r2
          path: dist/netqmon-agent_mipsel32r2

  # 4. Official OpenWrt Packages (Blocking: x86_64, aarch64, and armv7hf)
  job_build:
    name: Build OpenWrt Package [${{ matrix.platform }}-${{ matrix.ver }}]
    needs: [detect-changes, build-agent-binaries, build-agent-armv7hf]
    if: needs.detect-changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- 24.10.2 (ipk) ---
          - platform: x86_64
            sdk_ver: 24.10.2
            ver: "ipk"
            arch: x86_64
          - platform: aarch64_generic
            sdk_ver: 24.10.2
            ver: "ipk"
            arch: aarch64
          - platform: aarch64_cortex-a53
            sdk_ver: 24.10.2
            ver: "ipk"
            arch: aarch64
          - platform: aarch64_cortex-a72
            sdk_ver: 24.10.2
            ver: "ipk"
            arch: aarch64
          - platform: aarch64_cortex-a76
            sdk_ver: 24.10.2
            ver: "ipk"
            arch: aarch64
          - platform: arm_cortex-a7_vfpv4
            sdk_ver: 24.10.2
            ver: "ipk"
            arch: armv7hf
          - platform: arm_cortex-a7_neon-vfpv4
            sdk_ver: 24.10.2
            ver: "ipk"
            arch: armv7hf
          - platform: arm_cortex-a9_neon
            sdk_ver: 24.10.2
            ver: "ipk"
            arch: armv7hf
          - platform: arm_cortex-a9_vfpv3-d16
            sdk_ver: 24.10.2
            ver: "ipk"
            arch: armv7hf
          - platform: arm_cortex-a15_neon-vfpv4
            sdk_ver: 24.10.2
            ver: "ipk"
            arch: armv7hf
          - platform: arm_cortex-a5_vfpv4
            sdk_ver: 24.10.2
            ver: "ipk"
            arch: armv7hf
          - platform: arm_cortex-a8_vfpv3
            sdk_ver: 24.10.2
            ver: "ipk"
            arch: armv7hf

          # --- snapshots (apk) ---
          - platform: x86_64
            sdk_ver: snapshots
            ver: "apk"
            arch: x86_64
          - platform: aarch64_generic
            sdk_ver: snapshots
            ver: "apk"
            arch: aarch64
          - platform: aarch64_cortex-a53
            sdk_ver: snapshots
            ver: "apk"
            arch: aarch64
          - platform: aarch64_cortex-a72
            sdk_ver: snapshots
            ver: "apk"
            arch: aarch64
          - platform: aarch64_cortex-a76
            sdk_ver: snapshots
            ver: "apk"
            arch: aarch64
          - platform: arm_cortex-a7_vfpv4
            sdk_ver: snapshots
            ver: "apk"
            arch: armv7hf
          - platform: arm_cortex-a7_neon-vfpv4
            sdk_ver: snapshots
            ver: "apk"
            arch: armv7hf
          - platform: arm_cortex-a9_neon
            sdk_ver: snapshots
            ver: "apk"
            arch: armv7hf
          - platform: arm_cortex-a9_vfpv3-d16
            sdk_ver: snapshots
            ver: "apk"
            arch: armv7hf
          - platform: arm_cortex-a15_neon-vfpv4
            sdk_ver: snapshots
            ver: "apk"
            arch: armv7hf
          - platform: arm_cortex-a5_vfpv4
            sdk_ver: snapshots
            ver: "apk"
            arch: armv7hf
          - platform: arm_cortex-a8_vfpv3
            sdk_ver: snapshots
            ver: "apk"
            arch: armv7hf

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Download agent binary
        uses: actions/download-artifact@v4
        with:
          name: agent-binaries-${{ matrix.arch }}
          path: packaging/openwrt/netqmon/bin

      - name: Prepare packaging files
        run: |
          chmod 0755 packaging/openwrt/netqmon/bin/*
          mkdir -p packaging/openwrt/bin
          cp -r packaging/openwrt/netqmon/bin/* packaging/openwrt/bin/
          echo "CONFIG_PACKAGE_netqmon-agent=m" > .config
          echo "CONFIG_PACKAGE_luci-app-netqmon=m" >> .config
          version="$(awk -F'"' '/^\[workspace.package\]/{in_workspace=1; next} in_workspace && /^version = /{print $2; exit}' Cargo.toml)"
          if [ -n "${RELEASE_TAG}" ]; then
            test "${RELEASE_TAG#v}" = "${version}"
          fi
          package_version="${version}"
          if [ "${{ matrix.ver }}" = "apk" ] && [[ "${version}" == *-* ]]; then
            # Normalize prereleases for both tag releases and manual validation builds.
            package_version="${version%%-*}~$(git rev-parse --short=12 HEAD)"
          fi
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${package_version}/" packaging/openwrt/netqmon/Makefile
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${package_version}/" packaging/openwrt/luci-app-netqmon/Makefile

      - name: Build with OpenWrt SDK
        if: matrix.sdk_ver != 'snapshots'
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.sdk_ver == 'snapshots' && matrix.platform || format('{0}-{1}', matrix.platform, matrix.sdk_ver) }}
          FEED_DIR: ${{ github.workspace }}/packaging/openwrt
          PACKAGES: netqmon luci-app-netqmon
          NO_SHFMT_CHECK: "1"
          NO_REFRESH_CHECK: "1"
          V: s

      - name: Build with OpenWrt snapshot SDK (attempt 1)
        if: matrix.sdk_ver == 'snapshots'
        id: build_snapshot_sdk
        continue-on-error: true
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.platform }}
          FEED_DIR: ${{ github.workspace }}/packaging/openwrt
          PACKAGES: netqmon luci-app-netqmon
          NO_SHFMT_CHECK: "1"
          NO_REFRESH_CHECK: "1"
          V: s

      - name: Retry OpenWrt snapshot SDK after a rolling snapshot update
        if: matrix.sdk_ver == 'snapshots' && steps.build_snapshot_sdk.outcome == 'failure'
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.platform }}
          FEED_DIR: ${{ github.workspace }}/packaging/openwrt
          PACKAGES: netqmon luci-app-netqmon
          NO_SHFMT_CHECK: "1"
          NO_REFRESH_CHECK: "1"
          V: s

      - name: Process and Rename Artifacts
        id: compile
        run: |
          mkdir -p ${{ github.workspace }}/upload

          find bin/packages/ -type f \( -name 'netqmon-*.ipk' -o -name 'netqmon-*.apk' -o -name 'netqmon_*.ipk' -o -name 'netqmon_*.apk' -o -name 'luci-app-netqmon*.ipk' -o -name 'luci-app-netqmon*.apk' \) -exec cp {} ${{ github.workspace }}/upload/ \;

          cd ${{ github.workspace }}/upload

          if [ -z "$(ls -A . 2>/dev/null)" ]; then
            echo "Error: no ipk/apk artifacts found"
            exit 1
          fi

          ARCH="${{ matrix.platform }}"
          ARCH_ESCAPED=$(echo "$ARCH" | sed 's/[.*+?^${}()|[\]\\]/\\&/g')

          for file in *; do
            if [[ -f "$file" ]]; then
              filename="${file%.*}"
              extension="${file##*.}"

              if [[ ! "$filename" =~ _all$ ]] && [[ ! "$filename" =~ (^|[_-])${ARCH_ESCAPED}$ ]]; then
                new_name="${filename}_${ARCH}.${extension}"
                mv "$file" "$new_name"
                echo "Renamed: $file -> $new_name"
              else
                echo "Skipped: $file already contains architecture or is all."
              fi
            fi
          done

          echo "status=success" >> $GITHUB_OUTPUT
          echo "FIRMWARE=${{ github.workspace }}/upload" >> $GITHUB_ENV

      - name: Upload OpenWrt artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ matrix.platform }}-${{ matrix.ver }}
          path: upload/

  # 5. Experimental OpenWrt Packages (Non-blocking: RISC-V64 & MIPSEL)
  job_build_experimental:
    name: Build OpenWrt Package [${{ matrix.platform }}-${{ matrix.ver }}] [${{ matrix.status }}]
    needs: [detect-changes, build-agent-riscv64, build-agent-mipsel]
    if: needs.detect-changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- 24.10.2 (ipk) ---
          - platform: riscv64_riscv64
            sdk_ver: 24.10.2
            ver: "ipk"
            arch: riscv64
            status: "Candidate Official"
          - platform: mipsel_24kc
            sdk_ver: 24.10.2
            ver: "ipk"
            arch: mipsel32r2
            status: "Experimental"
          - platform: mipsel_74kc
            sdk_ver: 24.10.2
            ver: "ipk"
            arch: mipsel32r2
            status: "Experimental"
          - platform: mipsel_24kc_24kf
            sdk_ver: 24.10.2
            ver: "ipk"
            arch: mipsel32r2
            status: "Compatibility Test"

          # --- snapshots (apk) ---
          - platform: riscv64_generic
            # Snapshot ucode's FFI module assumes complex-number support that
            # RISC-V libffi lacks. Use a matching release SDK and pinned feeds.
            sdk_ver: 25.12.6
            sdk_archive: openwrt-sdk-25.12.6-d1-generic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            sdk_sha256: 6cdb2e5ccdf061d61e7e5bbbdeae7daaa9205f130d2a82621b2c09c65fe8e390
            ver: "apk"
            arch: riscv64
            status: "Candidate Official"
          - platform: mipsel_24kc
            sdk_ver: snapshots
            ver: "apk"
            arch: mipsel32r2
            status: "Experimental"
          - platform: mipsel_74kc
            sdk_ver: snapshots
            ver: "apk"
            arch: mipsel32r2
            status: "Experimental"
          - platform: mipsel_24kc_24kf
            sdk_ver: snapshots
            ver: "apk"
            arch: mipsel32r2
            status: "Compatibility Test"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Download agent binary
        uses: actions/download-artifact@v4
        with:
          name: agent-binaries-${{ matrix.arch }}
          path: packaging/openwrt/netqmon/bin

      - name: Prepare packaging files
        run: |
          chmod 0755 packaging/openwrt/netqmon/bin/*
          mkdir -p packaging/openwrt/bin
          cp -r packaging/openwrt/netqmon/bin/* packaging/openwrt/bin/
          echo "CONFIG_PACKAGE_netqmon-agent=m" > .config
          echo "CONFIG_PACKAGE_luci-app-netqmon=m" >> .config
          version="$(awk -F'"' '/^\[workspace.package\]/{in_workspace=1; next} in_workspace && /^version = /{print $2; exit}' Cargo.toml)"
          if [ -n "${RELEASE_TAG}" ]; then
            test "${RELEASE_TAG#v}" = "${version}"
          fi
          package_version="${version}"
          if [ "${{ matrix.ver }}" = "apk" ] && [[ "${version}" == *-* ]]; then
            # Normalize prereleases for both tag releases and manual validation builds.
            package_version="${version%%-*}~$(git rev-parse --short=12 HEAD)"
          fi
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${package_version}/" packaging/openwrt/netqmon/Makefile
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${package_version}/" packaging/openwrt/luci-app-netqmon/Makefile

      - name: Build with pinned OpenWrt release SDK
        if: matrix.sdk_archive
        shell: bash
        env:
          SDK_ARCHIVE: ${{ matrix.sdk_archive }}
          SDK_SHA256: ${{ matrix.sdk_sha256 }}
          SDK_VERSION: ${{ matrix.sdk_ver }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential gawk gettext libncurses-dev libssl-dev \
            python3-setuptools rsync unzip zstd
          sdk_dir="${RUNNER_TEMP}/openwrt-riscv-sdk"
          archive="${RUNNER_TEMP}/${SDK_ARCHIVE}"
          curl -fsSL --retry 5 --retry-connrefused --connect-timeout 15 \
            "https://downloads.openwrt.org/releases/${SDK_VERSION}/targets/d1/generic/${SDK_ARCHIVE}" \
            -o "$archive"
          printf '%s  %s\n' "$SDK_SHA256" "$archive" | sha256sum -c -
          mkdir -p "$sdk_dir"
          tar --zstd -xf "$archive" -C "$sdk_dir" --strip-components=1
          bash scripts/release/build-openwrt-sdk.sh \
            "$sdk_dir" "$GITHUB_WORKSPACE/packaging/openwrt" "$GITHUB_WORKSPACE"

      - name: Build with OpenWrt SDK
        if: matrix.sdk_ver != 'snapshots' && !matrix.sdk_archive
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.sdk_ver == 'snapshots' && matrix.platform || format('{0}-{1}', matrix.platform, matrix.sdk_ver) }}
          FEED_DIR: ${{ github.workspace }}/packaging/openwrt
          PACKAGES: netqmon luci-app-netqmon
          NO_SHFMT_CHECK: "1"
          NO_REFRESH_CHECK: "1"
          V: s

      - name: Build with OpenWrt snapshot SDK (attempt 1)
        if: matrix.sdk_ver == 'snapshots'
        id: build_snapshot_sdk
        continue-on-error: true
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.platform }}
          FEED_DIR: ${{ github.workspace }}/packaging/openwrt
          PACKAGES: netqmon luci-app-netqmon
          NO_SHFMT_CHECK: "1"
          NO_REFRESH_CHECK: "1"
          V: s

      - name: Retry OpenWrt snapshot SDK after a rolling snapshot update
        if: matrix.sdk_ver == 'snapshots' && steps.build_snapshot_sdk.outcome == 'failure'
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.platform }}
          FEED_DIR: ${{ github.workspace }}/packaging/openwrt
          PACKAGES: netqmon luci-app-netqmon
          NO_SHFMT_CHECK: "1"
          NO_REFRESH_CHECK: "1"
          V: s

      - name: Process and Rename Artifacts
        id: compile
        run: |
          mkdir -p ${{ github.workspace }}/upload

          find bin/packages/ -type f \( -name 'netqmon-*.ipk' -o -name 'netqmon-*.apk' -o -name 'netqmon_*.ipk' -o -name 'netqmon_*.apk' -o -name 'luci-app-netqmon*.ipk' -o -name 'luci-app-netqmon*.apk' \) -exec cp {} ${{ github.workspace }}/upload/ \;

          cd ${{ github.workspace }}/upload

          if [ -z "$(ls -A . 2>/dev/null)" ]; then
            echo "Error: no ipk/apk artifacts found"
            exit 1
          fi

          ARCH="${{ matrix.platform }}"
          ARCH_ESCAPED=$(echo "$ARCH" | sed 's/[.*+?^${}()|[\]\\]/\\&/g')

          for file in *; do
            if [[ -f "$file" ]]; then
              filename="${file%.*}"
              extension="${file##*.}"

              if [[ ! "$filename" =~ _all$ ]] && [[ ! "$filename" =~ (^|[_-])${ARCH_ESCAPED}$ ]]; then
                new_name="${filename}_${ARCH}.${extension}"
                mv "$file" "$new_name"
                echo "Renamed: $file -> $new_name"
              else
                echo "Skipped: $file already contains architecture or is all."
              fi
            fi
          done

          echo "status=success" >> $GITHUB_OUTPUT
          echo "FIRMWARE=${{ github.workspace }}/upload" >> $GITHUB_ENV

      - name: Upload OpenWrt artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ matrix.platform }}-${{ matrix.ver }}
          path: upload/


  publish-release-assets:
    name: Publish OpenWrt packages and manifest
    needs: [detect-changes, job_build, job_build_experimental]
    if: needs.detect-changes.outputs.build == 'true' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: openwrt-*-*
          path: ${{ runner.temp }}/openwrt-packages

      - name: Prepare release assets and channel manifest
        shell: bash
        run: |
          set -euo pipefail
          package_root="${{ runner.temp }}/openwrt-packages"
          release_assets="${{ runner.temp }}/openwrt-release-assets"
          mkdir -p "$release_assets"
          while IFS= read -r -d '' package; do
            name="$(basename "$package")"
            if [ ! -e "$release_assets/$name" ]; then
              cp "$package" "$release_assets/$name"
            fi
          done < <(find "$package_root" -type f \( -name '*.ipk' -o -name '*.apk' \) -print0 | sort -z)

          release_tag="${RELEASE_TAG}"
          version="${release_tag#v}"
          if [[ "$version" == *-* ]]; then
            channel=beta
          else
            channel=stable
          fi
          python3 scripts/release/generate_openwrt_manifest.py \
            --repository "$GITHUB_REPOSITORY" \
            --release "$channel:$release_tag:$package_root" \
            --output "$release_assets/openwrt-agent-manifest.json"

      - name: Publish packages and manifest to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          files: ${{ runner.temp }}/openwrt-release-assets/*
