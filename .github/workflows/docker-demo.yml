name: Docker Demo

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Demo image version tag'
        required: false
        default: '0.1.0-demo'

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Push Demo Image (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Demo image for smoke test
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          docker build --build-arg "NETQMON_DEMO_VERSION=${INPUT_TAG:-0.1.0-demo}" -f deploy/demo/Dockerfile -t netqmon-demo:smoke .

      - name: Smoke test Demo container startup
        run: |
          docker run -d --name netqmon-demo-smoke -p 3000:3000 netqmon-demo:smoke
          for attempt in $(seq 1 30); do
            if docker exec netqmon-demo-smoke wget -q -O - http://127.0.0.1:8091/internal/health | grep -q "ok"; then
              echo "Demo internal health check passed!"
              docker logs netqmon-demo-smoke
              exit 0
            fi
            sleep 2
          done
          echo "Smoke test timed out"
          docker logs netqmon-demo-smoke
          exit 1

      - name: Smoke test public read-only boundary
        run: |
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/overview)" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/settings/diagnostics)" = "404"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/api/overview)" = "403"
          curl -fsS 'http://127.0.0.1:3000/api/policies?gateway_id=demo-gateway' > /tmp/netqmon-demo-policies.json
          python3 -c 'import json; d=json.load(open("/tmp/netqmon-demo-policies.json"))["data"]; assert d["total"] == 4; assert d["capabilities"]["status"] == "demo"'
          python3 -c 'import json,time; p=next(p for p in json.load(open("/tmp/netqmon-demo-policies.json"))["data"]["items"] if p["spec"]["selectors"]["applications"] == ["youtube"]); print(json.dumps(dict(gateway_id="demo-gateway",client_mac=p["spec"]["selectors"]["clients"][0],application_id="youtube",category_id="streaming",application_confidence=0.99,scope="internet",at_ms=int(time.time()*1000))))' > /tmp/netqmon-demo-preview.json
          curl -fsS -H 'Origin: http://127.0.0.1:3000' -H 'Content-Type: application/json' --data-binary @/tmp/netqmon-demo-preview.json http://127.0.0.1:3000/api/policies/preview > /tmp/netqmon-demo-preview-result.json
          python3 -c 'import json; assert json.load(open("/tmp/netqmon-demo-preview-result.json"))["data"]["selected_block_verdict"] == "block"'
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST 'http://127.0.0.1:3000/api/policies/republish?gateway_id=demo-gateway')" = "403"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X PATCH 'http://127.0.0.1:3000/api/policies/example/enabled')" = "403"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE 'http://127.0.0.1:3000/api/policies/example')" = "403"


      - name: Stop smoke test container
        if: always()
        run: |
          docker rm -f netqmon-demo-smoke || true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker tags
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          target_repo="ghcr.io/${{ github.repository }}-demo"
          tags="${target_repo}:latest"
          if [[ -n "${INPUT_TAG}" && "${INPUT_TAG}" != "latest" ]]; then
            tags="${tags},${target_repo}:${INPUT_TAG}"
          fi
          branch_tag="${GITHUB_REF_NAME//\//-}"
          if [[ -n "${branch_tag}" ]]; then
            tags="${tags},${target_repo}:${branch_tag}"
          fi
          tags="${tags},${target_repo}:${GITHUB_SHA::7}"
          tags="${tags},ghcr.io/${{ github.repository }}:demo"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push Demo image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/demo/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NETQMON_DEMO_VERSION=${{ inputs.tag }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=demo-amd64
          cache-to: type=gha,mode=max,scope=demo-amd64

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "ghcr.io/${{ github.repository }}-demo:latest"
