name: Docker

on:
  workflow_dispatch:
    inputs:
      build_profile:
        description: "BuildKit output detail"
        required: false
        default: plain
        type: choice
        options: [auto, plain, tty]
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Controller Image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          cargo_version="$(awk -F'"' '/^\[workspace.package\]/{in_workspace=1; next} in_workspace && /^version = /{print $2; exit}' Cargo.toml)"
          release_version="${GITHUB_REF_NAME#v}"
          test "${cargo_version}" = "${release_version}" \
            || { echo "Cargo workspace version ${cargo_version} does not match tag ${release_version}" >&2; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Compose configuration
        run: docker compose config

      - name: Validate classifier component trust key
        env:
          NETQMON_CLASSIFIER_COMPONENT_PUBLIC_KEY_HEX: ${{ vars.NETQMON_CLASSIFIER_COMPONENT_PUBLIC_KEY_HEX }}
        run: |
          test "${#NETQMON_CLASSIFIER_COMPONENT_PUBLIC_KEY_HEX}" -eq 64
          case "${NETQMON_CLASSIFIER_COMPONENT_PUBLIC_KEY_HEX}" in
            (*[!0-9a-fA-F]*) echo "NETQMON_CLASSIFIER_COMPONENT_PUBLIC_KEY_HEX must contain only hexadecimal characters" >&2; exit 1 ;;
          esac

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.controller
          platforms: ${{ matrix.platform }}
          build-args: |
            NETQMON_CLASSIFIER_COMPONENT_PUBLIC_KEY_HEX=${{ vars.NETQMON_CLASSIFIER_COMPONENT_PUBLIC_KEY_HEX }}
          outputs: type=image,"name=ghcr.io/${{ github.repository }}",push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
          progress: ${{ inputs.build_profile || 'auto' }}
          cache-from: type=gha,scope=controller-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=controller-${{ matrix.arch }}

      - name: Pull image for smoke test
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          IMAGE_DIGEST: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: docker pull "$IMAGE_DIGEST"

      - name: Record image size diagnostics
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          IMAGE_DIGEST: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/image-diagnostics"
          docker image inspect "$IMAGE_DIGEST" --format '{{json .}}' > "${{ runner.temp }}/image-diagnostics/${{ matrix.arch }}-inspect.json"
          docker history --no-trunc "$IMAGE_DIGEST" > "${{ runner.temp }}/image-diagnostics/${{ matrix.arch }}-history.txt"
          docker system df -v > "${{ runner.temp }}/image-diagnostics/${{ matrix.arch }}-disk-usage.txt"
          docker pull --quiet "$IMAGE_DIGEST" > "${{ runner.temp }}/image-diagnostics/${{ matrix.arch }}-pull.txt"
          image_id="$(docker image inspect "$IMAGE_DIGEST" --format '{{.Id}}')"
          image_id_prefix="${image_id#sha256:}"
          image_id_prefix="${image_id_prefix:0:12}"
          expanded_bytes="$(docker image inspect "$IMAGE_DIGEST" --format '{{.Size}}')"
          unique_size="$(awk -v id="$image_id_prefix" '$0 ~ id {print $(NF-2); found=1} END {if (!found) print "unavailable"}' "${{ runner.temp }}/image-diagnostics/${{ matrix.arch }}-disk-usage.txt")"
          printf 'expanded_bytes=%s\nunique_layer_size=%s\n' "$expanded_bytes" "$unique_size" > "${{ runner.temp }}/image-diagnostics/${{ matrix.arch }}-size.txt"
          if docker buildx imagetools inspect "$IMAGE_DIGEST" --raw > "${{ runner.temp }}/image-diagnostics/${{ matrix.arch }}-manifest.json" 2>/dev/null; then
            jq -r '"compressed_layer_bytes=" + (([.layers[]?.size] | add) // 0 | tostring)' \
              "${{ runner.temp }}/image-diagnostics/${{ matrix.arch }}-manifest.json" \
              >> "${{ runner.temp }}/image-diagnostics/${{ matrix.arch }}-size.txt"
          fi

      - name: Verify native dependencies and runtime sizes
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          IMAGE_DIGEST: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh "$IMAGE_DIGEST" -c '
            set -eu
            echo "== ldd netqmon-collector =="
            ldd /usr/local/bin/netqmon-collector
            echo "== ldd netqmon-classifier-manager =="
            ldd /usr/local/bin/netqmon-classifier-manager
            echo "== native and application sizes =="
            du -h -d 1 /usr/local/lib /usr/local/bin /app 2>/dev/null | sort -h
          ' > "${{ runner.temp }}/image-diagnostics/${{ matrix.arch }}-runtime.txt"

      - name: Upload image size diagnostics
        if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: image-diagnostics-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Smoke test Controller compose startup
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          NETQMON_CONTROLLER_IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          docker compose up -d --no-build controller
          for attempt in {1..30}; do
            if docker exec netqmon-controller netqmon-controller-healthcheck; then
              docker compose ps
              exit 0
            fi
            docker compose ps
            docker logs --tail 50 netqmon-controller
            sleep 2
          done
          docker compose ps
          docker logs netqmon-controller
          exit 1

      - name: Smoke test Controller docker restart
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          NETQMON_CONTROLLER_IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          docker compose restart controller
          for attempt in {1..30}; do
            if docker exec netqmon-controller netqmon-controller-healthcheck; then
              docker compose ps
              exit 0
            fi
            docker compose ps
            docker logs --tail 50 netqmon-controller
            sleep 2
          done
          docker compose ps
          docker logs netqmon-controller
          exit 1

      - name: Stop smoke test services
        if: always()
        run: docker compose down --volumes

      - name: Export digest
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge and Publish Manifest List
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags=()
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tags+=("-t" "ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME}")
            tags+=("-t" "ghcr.io/${{ github.repository }}:latest")
          else
            tags+=("-t" "ghcr.io/${{ github.repository }}:dev-${GITHUB_SHA}")
            tags+=("-t" "ghcr.io/${{ github.repository }}:dev-latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          target="ghcr.io/${{ github.repository }}:latest"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            target="ghcr.io/${{ github.repository }}:dev-latest"
          fi
          docker buildx imagetools inspect "$target"
