[workspace]
members = [
    "crates/agent",
    "crates/classifier-client",
    "crates/classifier-manager",
    "crates/collector",
    "crates/geo",
    "crates/protocol",
    "crates/storage",
]
resolver = "2"
exclude = ["crates/libbpf-sys"]

# Static agent builds need the token fixes even when the host libbpf is older.
[patch.crates-io]
libbpf-sys = { path = "crates/libbpf-sys" }

[workspace.package]
version = "1.1.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/jarvis2f/netqmon"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
